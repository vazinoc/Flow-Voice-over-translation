name: Auto Release on Upstream Update

on:
  workflow_dispatch: # Ручной запуск при необходимости
  schedule:
    - cron: '0 */6 * * *' # Проверка каждые 6 часов

jobs:
  check_and_release:
    name: Check Upstream Release & Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Получаем тег последнего официального релиза Flow и сравниваем с нашим
      - name: Check latest upstream release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Получаем последний релиз оригинала
          UPSTREAM_TAG=$(gh api repos/Flow-Tube/Flow/releases/latest --jq .tag_name 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Не удалось получить последний релиз upstream"
            exit 1
          fi
          echo "Последний релиз оригинального Flow: $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          # Формируем имя нашего целевого тега
          MY_TARGET_TAG="${UPSTREAM_TAG}-vot"
          echo "target_tag=$MY_TARGET_TAG" >> "$GITHUB_OUTPUT"

          # Проверяем, выпускали ли мы уже релиз для этой версии
          if git rev-parse "$MY_TARGET_TAG" >/dev/null 2>&1; then
            echo "Релиз $MY_TARGET_TAG уже существует у нас."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Запуск вручную: продолжаем сборку."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Автозапуск: сборка не требуется."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Обнаружен НОВЫЙ релиз ($UPSTREAM_TAG)! Запускаем слияние и релиз."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      # 2. Если сборка не требуется — останавливаемся и не тратим ресурсы
      - name: Stop if up-to-date
        if: ${{ steps.check_release.outputs.should_build != 'true' }}
        run: |
          echo "Репозиторий актуален, новый релиз не требуется."
          exit 0

      # 3. Вливаем код из тега нового релиза
      - name: Merge Upstream Release Tag
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Flow-Tube/Flow.git || true
          git fetch upstream --tags

          TAG="${{ steps.check_release.outputs.upstream_tag }}"
          echo "Объединяем код с тегом $TAG..."
          if git merge "$TAG" -m "auto: merge upstream release $TAG"; then
            git push origin main
          else
            echo "::warning::Обнаружен конфликт слияния с тегом $TAG! Сборка отменена."
            exit 1
          fi

      - name: Set up JDK 21
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: chmod +x gradlew

      - name: Build GitHub Debug APK
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: ./gradlew assembleGithubDebug --stacktrace --no-daemon

      - name: Prepare APK for Release
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/github/debug/ -name "*.apk" -exec cp {} release-apk/Flow-with-Yandex-VOT.apk \;

      # 4. Публикуем релиз с именем и номером версии оригинала
      - name: Create GitHub Release
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.target_tag }}
          name: "Flow ${{ steps.check_release.outputs.upstream_tag }} + Yandex VOT"
          body: |
            ### Релиз Flow ${{ steps.check_release.outputs.upstream_tag }} с закадровым переводом от Яндекса
            - Синхронизировано с официальным релизом **Flow ${{ steps.check_release.outputs.upstream_tag }}**
            - Встроен закадровый перевод видео (VOT) и управление громкостью
            - Готовый к установке файл `.apk`
          files: release-apk/Flow-with-Yandex-VOT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
