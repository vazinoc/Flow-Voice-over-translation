name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    # Разрешаем Actions создавать релизы и прикреплять файлы
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GitHub Debug APK
        run: ./gradlew assembleGithubDebug --stacktrace --no-daemon

      # Находим скомпилированный APK и переименовываем его в понятное имя для релиза
      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          # Находим универсальный или arm64 apk и копируем
          find app/build/outputs/apk/github/debug/ -name "*.apk" -exec cp {} release-apk/Flow-with-Yandex-VOT.apk \;

      # Публикуем в GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-vot-${{ github.run_number }}"
          name: "Flow with Yandex VOT (Build #${{ github.run_number }})"
          body: |
            ### Flow с закадровым переводом от Яндекса
            - Добавлен закадровый перевод видео (VOT)
            - Панель управления и шторка настроек громкости / языков
            - Собрано на базе последнего исходного кода Flow
          files: release-apk/Flow-with-Yandex-VOT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
