name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        # Возвращаем родные лимиты памяти от разработчиков Flow, чтобы сервер не захлебнулся
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GitHub Debug APK
        # Собираем ТОЛЬКО одну версию (githubDebug). 
        # --no-daemon убивает фоновые процессы после шага, освобождая ОЗУ.
        run: ./gradlew assembleGithubDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
